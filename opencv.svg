<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" fill="none">
  <defs>
    <linearGradient id="p1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <pattern id="gridPattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#1E293B" stroke-width="0.8"/>
    </pattern>
  </defs>

  <rect width="600" height="360" rx="16" fill="url(#p1Grad)"/>
  <rect width="600" height="360" rx="16" fill="url(#gridPattern)" opacity="0.7"/>
  <rect x="1.5" y="1.5" width="597" height="357" rx="14.5" stroke="#334155" stroke-width="1.5"/>

  <!-- Tech Header Bar -->
  <rect x="0" y="0" width="600" height="42" rx="16" fill="#0B0F19"/>
  <line x1="0" y1="42" x2="600" y2="42" stroke="#1E293B" stroke-width="1.5"/>
  <circle cx="24" cy="21" r="5" fill="#EF4444"/>
  <circle cx="42" cy="21" r="5" fill="#F59E0B"/>
  <circle cx="60" cy="21" r="5" fill="#10B981"/>
  <text x="300" y="26" text-anchor="middle" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">opencv_face_detection_pipeline.py — Python 3.10</text>

  <!-- Face Bounding Box & Landmarks -->
  <g transform="translate(180, 75)">
    <!-- Simulated Face Mesh / Silhouette -->
    <ellipse cx="120" cy="115" rx="75" ry="95" fill="#0B132B" stroke="#1E293B" stroke-dasharray="4 4" stroke-width="1.5"/>
    
    <!-- Target Bounding Box -->
    <rect x="30" y="10" width="180" height="215" rx="10" fill="none" stroke="#00D2FF" stroke-width="2"/>
    
    <!-- Target Corners -->
    <path d="M 30 40 L 30 10 L 60 10" stroke="#00D2FF" stroke-width="3" stroke-linecap="round"/>
    <path d="M 210 40 L 210 10 L 180 10" stroke="#00D2FF" stroke-width="3" stroke-linecap="round"/>
    <path d="M 30 195 L 30 225 L 60 225" stroke="#00D2FF" stroke-width="3" stroke-linecap="round"/>
    <path d="M 210 195 L 210 225 L 180 225" stroke="#00D2FF" stroke-width="3" stroke-linecap="round"/>

    <!-- Facial Landmarks (Eyes, Nose, Mouth) -->
    <circle cx="90" cy="95" r="4" fill="#00D2FF"/>
    <circle cx="150" cy="95" r="4" fill="#00D2FF"/>
    <line x1="80" y1="95" x2="100" y2="95" stroke="#00D2FF" stroke-width="1.5"/>
    <line x1="140" y1="95" x2="160" y2="95" stroke="#00D2FF" stroke-width="1.5"/>

    <circle cx="120" cy="125" r="3.5" fill="#3B82F6"/>
    <path d="M 98 160 Q 120 178 142 160" stroke="#00D2FF" stroke-width="2" fill="none"/>

    <!-- Detection Tag Badge -->
    <rect x="30" y="235" width="180" height="26" rx="6" fill="#0A192F" stroke="#00D2FF" stroke-width="1"/>
    <text x="120" y="252" text-anchor="middle" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">CONFIDENCE: 98.4% [FACE_01]</text>
  </g>

  <!-- Left Stats HUD -->
  <g transform="translate(30, 75)">
    <rect width="130" height="70" rx="8" fill="#0B1329" stroke="#1E293B" stroke-width="1"/>
    <text x="14" y="24" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10">ALGORITHM</text>
    <text x="14" y="44" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700">Haar Cascade</text>
    <text x="14" y="60" fill="#00D2FF" font-family="'JetBrains Mono', monospace" font-size="11">+ DNN Model</text>

    <rect y="85" width="130" height="70" rx="8" fill="#0B1329" stroke="#1E293B" stroke-width="1"/>
    <text x="14" y="109" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10">FPS / LATENCY</text>
    <text x="14" y="129" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">62.5 FPS</text>
    <text x="14" y="145" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">16.0 ms</text>
  </g>

  <!-- Right Code HUD -->
  <g transform="translate(435, 75)">
    <rect width="135" height="155" rx="8" fill="#0B1329" stroke="#1E293B" stroke-width="1"/>
    <text x="12" y="24" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10">CODE SNIPPET</text>
    <text x="12" y="46" fill="#F43F5E" font-family="'JetBrains Mono', monospace" font-size="11">import cv2</text>
    <text x="12" y="68" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="10">cap = cv2.VideoCapture()</text>
    <text x="12" y="90" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="10">gray = cvtColor(frame)</text>
    <text x="12" y="112" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="10">detectMultiScale()</text>
    <text x="12" y="138" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="11">● Active Stream</text>
  </g>

  <!-- Bottom Info Footer -->
  <rect x="30" y="310" width="540" height="34" rx="8" fill="#0A111F" stroke="#1E293B" stroke-width="1"/>
  <text x="45" y="331" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">PROJ-01: OPENCV 人臉偵測與辨識技術實作學習紀錄 • BUI DUY CHIEN</text>
  <text x="555" y="331" text-anchor="end" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">● 學習中</text>
</svg>
