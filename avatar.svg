<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12161F"/>
      <stop offset="100%" stop-color="#0A0C10"/>
    </linearGradient>
    <linearGradient id="blueGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#00D2FF"/>
    </linearGradient>
    <linearGradient id="silhouetteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#242C3D"/>
      <stop offset="100%" stop-color="#161B26"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1E2638" stroke-width="0.8"/>
    </pattern>
  </defs>

  <!-- Frame Background -->
  <rect width="400" height="480" rx="24" fill="url(#bgGrad)"/>
  <rect width="400" height="480" rx="24" fill="url(#grid)" opacity="0.65"/>
  <rect x="1.5" y="1.5" width="397" height="477" rx="22.5" stroke="#242C3D" stroke-width="2"/>

  <!-- Cyber Corner Accents -->
  <path d="M 20 50 L 20 20 L 50 20" stroke="#00D2FF" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 380 50 L 380 20 L 350 20" stroke="#00D2FF" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 20 430 L 20 460 L 50 460" stroke="#00D2FF" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 380 430 L 380 460 L 350 460" stroke="#00D2FF" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Tech Geometric Circles in Background -->
  <circle cx="200" cy="200" r="140" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="6 6"/>
  <circle cx="200" cy="200" r="105" stroke="#3B82F6" stroke-width="1.2" opacity="0.3"/>

  <!-- Tech Silhouette -->
  <!-- Shoulders / Torso -->
  <path d="M 90 410 C 90 330 140 310 200 310 C 260 310 310 330 310 410 Z" fill="url(#silhouetteGrad)"/>
  <path d="M 90 410 C 90 330 140 310 200 310 C 260 310 310 330 310 410 Z" stroke="#3B82F6" stroke-width="1.5" opacity="0.5"/>
  
  <!-- Neck -->
  <rect x="180" y="240" width="40" height="75" rx="6" fill="#1C2331"/>

  <!-- Head -->
  <ellipse cx="200" cy="180" rx="65" ry="80" fill="url(#silhouetteGrad)" stroke="#00D2FF" stroke-width="1.5"/>

  <!-- Tech Glasses / Visor line -->
  <rect x="150" y="165" width="100" height="12" rx="6" fill="#00D2FF" opacity="0.85"/>
  <line x1="130" y1="171" x2="150" y2="171" stroke="#00D2FF" stroke-width="2"/>
  <line x1="250" y1="171" x2="270" y2="171" stroke="#00D2FF" stroke-width="2"/>

  <!-- Center Monogram -->
  <text x="200" y="375" text-anchor="middle" fill="#FFFFFF" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="20" font-weight="700" letter-spacing="4">BUI DUY CHIEN</text>
  <text x="200" y="400" text-anchor="middle" fill="#94A3B8" font-family="'Noto Sans TC', sans-serif" font-size="14" letter-spacing="3">裴維戰 • 資訊科技</text>

  <!-- Status Pill at Bottom -->
  <g transform="translate(110, 426)">
    <rect width="180" height="30" rx="15" fill="#0D111A" stroke="#00D2FF" stroke-width="1.2"/>
    <circle cx="20" cy="15" r="4.5" fill="#10B981"/>
    <text x="34" y="20" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">STUDENT • SENIOR</text>
  </g>
</svg>
